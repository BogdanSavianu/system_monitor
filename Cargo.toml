[package]
name = "system-monitor"
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
csv = "1.4"
smartcore = { version = "0.4", features = ["serde"] }
serde_json = "1"
dioxus = { version = "0.7", optional = true, features = ["desktop"] }
dioxus-desktop = { version = "0.7", optional = true }
native-tls = { version = "0.2", optional = true, features = ["vendored"] }
futures-timer = { version = "3", optional = true }
plotters = { version = "0.3", optional = true }
time = { version = "0.3", features = ["formatting", "parsing"] }
object = { version = "0.36", optional = true, default-features = false, features = ["read_core", "elf", "std"] }
memmap2 = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
addr2line = { version = "0.24", optional = true, default-features = false, features = ["std", "loader"] }

[dependencies.rusqlite]
version = "0.39.0"
features = [ "bundled" ]

[dependencies.uuid]
version = "1.23.0"
features = [ "v4" ]

[features]
default = []
leakprobe = ["dep:object", "dep:memmap2", "dep:tempfile", "dep:addr2line"]
dioxus-gui = ["leakprobe", "dep:dioxus", "dep:dioxus-desktop", "dep:native-tls", "dep:futures-timer", "dep:plotters"]
